PLG_DJCATALOG2_CHECKOUTLOG_LOG_CART_SUMMARY_DESC="Record an entry each time the basket page recalculates totals after a delivery method is selected. Captures products total, delivery cost, and grand total. (The postcode is not available at this stage – it is handled in JavaScript only.)"

PLG_DJCATALOG2_CHECKOUTLOG_LOG_ORDERS_LABEL="Log placed orders"
