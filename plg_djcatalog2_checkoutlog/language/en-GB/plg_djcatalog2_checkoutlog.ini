PLG_DJCATALOG2_CHECKOUTLOG="DJ Catalog2 - Checkout Logger"
PLG_DJCATALOG2_CHECKOUTLOG_XML_DESCRIPTION="Logs basket delivery-price lookups and completed orders (including postcode and price breakdown) to the #__djc2_checkout_log database table."

